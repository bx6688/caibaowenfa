<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例检索 - AI法律助手</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 案例检索页面特定样式 */
        .cases-container {
            padding: 20px;
            height: calc(100vh - 60px);
            overflow-y: auto;
        }

        /* 搜索区域样式 */
        .search-section {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* ========== 改动：移除原来单独的search-box，筛选行包含关键词框 ========== */
        .search-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            font-weight: bold;
            color: #555;
            white-space: nowrap;
        }

        .filter-group select,
        .filter-group input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        /* 关键词输入框单独的最小宽度 */
        .filter-keyword input{
            min-width:260px;
        }
        /* 搜索按钮容器，居中 */
        .search-btn-wrap{
            width:100%;
            text-align:center;
            margin-top:18px;
        }
        .search-btn {
            padding: 8px 22px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: #2980b9;
        }

        /* 结果区域样式 */
        .results-section {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .results-count {
            font-size: 16px;
            color: #666;
        }

        #results-number {
            font-weight: bold;
            color: #3498db;
        }

        .sort-options {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sort-options label {
            font-weight: bold;
            color: #555;
        }

        #sort-by {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        /* 案例卡片样式 */
        .case-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .case-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        .case-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
        }

        .case-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .case-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #777;
        }

        .case-type,
        .case-court,
        .case-date {
            padding: 3px 8px;
            background-color: #e8f4fd;
            border-radius: 12px;
        }

        .case-content {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .view-detail-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .view-detail-btn:hover {
            background-color: #2980b9;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 16px;
            grid-column: 1 / -1;
        }

        /* 快捷案例类型 */
        .quick-types {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .quick-types-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .type-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .type-card {
            text-align: center;
            padding: 20px 15px;
            border: 1px solid #eee;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #f9f9f9;
        }

        .type-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-color: #3498db;
            background-color: #ebf5fb;
        }

        .type-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .type-name {
            font-weight: bold;
            color: #2c3e50;
        }

        /* 加载更多按钮 */
        .load-more-wrap {
            width:100%;
            text-align:center;
            margin-top:20px;
        }
        .load-more-btn{
            padding: 8px 22px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .load-more-btn:hover{
            background-color:#2980b9;
        }

        /* 案例详情模态框 */
        .case-detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .case-detail-content {
            background-color: white;
            border-radius: 8px;
            margin: 50px auto;
            padding: 30px;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .case-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #3498db;
        }

        .case-detail-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        .close-detail {
            font-size: 28px;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
        }

        .close-detail:hover {
            color: #666;
        }

        .case-detail-body {
            line-height: 1.8;
            color: #333;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h4 {
            font-size: 16px;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 10px;
        }

        .detail-content {
            padding-left: 20px;
        }

        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .detail-meta-item {
            padding: 5px 10px;
            background-color: #f0f0f0;
            border-radius: 15px;
            font-size: 14px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .search-filters {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                flex-direction: column;
                align-items: stretch;
            }

            .case-results {
                grid-template-columns: 1fr;
            }

            .case-detail-content {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>

        <!-- 主内容区域 -->
        <div class="main-content" id="main-content">

                <button class="menu-btn" id="open-sidebar">☰</button>

            <!-- 案例检索内容 -->
            <div class="cases-container">
                <!-- 快捷案例类型 -->
                <div class="quick-types">
                    <h3 class="quick-types-title">快捷案例类型</h3>
                    <div class="type-cards">
                        <div class="type-card" data-type="contract">
                            <div class="type-icon">📝</div>
                            <div class="type-name">合同纠纷</div>
                        </div>
                        <div class="type-card" data-type="labor">
                            <div class="type-icon">👥</div>
                            <div class="type-name">劳动纠纷</div>
                        </div>
                        <div class="type-card" data-type="property">
                            <div class="type-icon">🏠</div>
                            <div class="type-name">物权纠纷</div>
                        </div>
                        <div class="type-card" data-type="tort">
                            <div class="type-icon">⚖️</div>
                            <div class="type-name">侵权责任</div>
                        </div>
                        <div class="type-card" data-type="intellectual">

    <script src="script.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const baseUrl = "https://caibaowenfa.onrender.com";
    let evtSource = null;
    let currentPage = 1;
    let allLoadedList = [];
    const loadedCaseIdSet = new Set();
    let searchParamsCache = null;
    let isQuickCardTrigger = false; // 标记是否是快捷卡片点击

    const searchBtn = document.querySelector('.search-btn');
    const caseSearchInput = document.getElementById('case-search-input');
    const caseResults = document.getElementById('case-results');
    const resultsNumber = document.getElementById('results-number');
    const sortBy = document.getElementById('sort-by');
    const caseTypeSelect = document.getElementById('case-type');
    const caseYearSelect = document.getElementById('case-year');
    const caseCourtInput = document.getElementById('case-court');
    const caseDetailModal = document.getElementById('case-detail-modal');
    const closeDetail = document.getElementById('close-detail');
    const loadMoreWrap = document.getElementById('load-more-wrap');
    const loadMoreBtn = document.getElementById('load-more-btn');

    document.querySelectorAll('.type-card').forEach(card => {
        card.addEventListener('click', function() {
            const typeValue = this.getAttribute('data-type');
            caseTypeSelect.value = typeValue;
            isQuickCardTrigger = true;
            performSearch();
        });
    });

    // 加载更多
    if (loadMoreBtn) {
        loadMoreBtn.onclick = function(){
            currentPage++;
            fetchPageData();
        }
    }

    function renderList(list){
        let html = "";
        list.forEach(item=>{
            const title = item.output?.slice(0, 60) || "未知案例";
            const type = item.extractCaseType || "";
            const court = item.extractCourt || "";
            const date = item.extractYear ? String(item.extractYear) : "";
            const content = item.output || "";

            html += `
<div class="case-card">
    <h4 class="case-title">${title}</h4>
    <div class="case-meta">
        <span class="case-type">${type}</span>
        <span class="case-court">${court}</span>
        <span class="case-date">${date}</span>
    </div>
    <p class="case-content">${content}</p>
    <button class="view-detail-btn" data-item='${JSON.stringify(item).replaceAll("'","\\'")}'>查看详情</button>
</div>`;
        });
        if(caseResults) caseResults.innerHTML = html;

        document.querySelectorAll('.view-detail-btn').forEach(btn=>{
            btn.onclick=function(){
                const item = JSON.parse(this.dataset.item);
                document.getElementById('detail-title').innerText = item.output?.slice(0, 80) || "案例详情";
                document.getElementById('detail-type').innerText = item.extractCaseType || "";
                document.getElementById('detail-court').innerText = item.extractCourt || "";
                document.getElementById('detail-date').innerText = item.extractYear ? String(item.extractYear) : "";
                document.getElementById('detail-case').innerText = item.output || "";
                document.getElementById('detail-judgment').innerText = "";
                document.getElementById('detail-key-points').innerText = "";
                document.getElementById('detail-legal-basis').innerText = "";
                if(caseDetailModal) caseDetailModal.style.display='block';
            }
        })
    }

    async function fetchPageData(){
        if(evtSource) evtSource.close();
        const params = searchParamsCache;
        if (!params) {
            if(caseResults) caseResults.innerHTML = `<div class="no-results">搜索参数异常</div>`;
            return;
        }
        params.set("page", String(currentPage));
        const url = `${baseUrl}/api/stream?${params.toString()}`;
        evtSource = new EventSource(url);

        evtSource.onmessage = (e) => {
          if (e.data === "PING") return;
          if (e.data === "[DONE]") {
            evtSource.close();
            return;
          }
          try {
            const resObj = JSON.parse(e.data);
            console.log("【案例返回】", resObj);
            if (resObj.type === "case") {
              const resultData = resObj.data;
              const caseList = Array.isArray(resultData.final_list) ? resultData.final_list : [];
              const total = Number(resultData.total) || 0;

              if(resultsNumber) resultsNumber.textContent = total;

              if (caseList.length === 0) {
                caseResults.innerHTML = `<div class="no-results">${resultData.tip_msg || '暂无匹配案例'}</div>`;
                if(loadMoreWrap) loadMoreWrap.style.display = "none";
                return;
              }
              renderList(caseList);
              if(loadMoreWrap) loadMoreWrap.style.display = "block";
            }
          } catch (err) {
            console.error("案例前端解析错误", err, e.data);
          }
        };

        evtSource.onerror = ()=>{
            evtSource.close();
            if(caseResults) caseResults.innerHTML = `<div class="no-results">请求出错，请重试</div>`;
        };
    }

    async function performSearch() {
        if(evtSource) evtSource.close();
        // 重置分页
        currentPage = 1;
        allLoadedList = [];
        loadedCaseIdSet.clear();

        const keyword = caseSearchInput ? caseSearchInput.value.trim() : "";
        const raw_case_type = caseTypeSelect ? caseTypeSelect.value : "all";
        const court = caseCourtInput ? caseCourtInput.value.trim() : "";
        const raw_year = caseYearSelect ? caseYearSelect.value : "all";
        const sort_type = sortBy ? sortBy.value : "relevance";

        // 映射：前端英文 value → Coze 中文 case_type
        const typeMap = {
            "all": "全部类型",
            "contract": "合同纠纷",
            "labor": "劳动纠纷",
            "property": "物权纠纷",
            "tort": "侵权责任",
            "intellectual": "知识产权",
            "family": "婚姻家庭"
        };
        const case_type = typeMap[raw_case_type] || "全部类型";
        // Coze year 是 int：全部年份传数字 0，否则转数字
        const year = raw_year === 'all' ? 0 : Number(raw_year);

        // ===== 校验规则：只有【不是快捷卡片点击】的时候，才执行校验 =====
        if (!isQuickCardTrigger) {
            const isAllType = case_type === "全部类型";
            const isAllYear = year === 0;
            if (isAllType || isAllYear) {
                if (!keyword && !court) {
                    alert('【案件类型为全部类型】或【年份范围为全部年份】时，请输入关键词或者填写法律援助中心！');
                    return;
                }
            }
        }
        // 搜索执行完，清空标记
        isQuickCardTrigger = false;

        if(caseResults) caseResults.innerHTML = `<div class="no-results">正在 AI 检索案例...</div>`;
        if(resultsNumber) resultsNumber.textContent = "0";
        if(loadMoreWrap) loadMoreWrap.style.display = "none";

        // 和 Coze 开始节点变量严格对齐
        const params = new URLSearchParams();
        params.append("mode","workflow");
        params.append("workflow_id","7702373812499480630");
        params.append("keyword", keyword);
        params.append("case_type", case_type);
        params.append("court", court);
        params.append("year", String(year));
        params.append("sort_type", sort_type);
        params.append("search_mode","search");
        params.append("page","1");
        searchParamsCache = params;

        fetchPageData();
    }

    if(searchBtn) searchBtn.addEventListener('click', performSearch);
    if(caseSearchInput){
        caseSearchInput.addEventListener('keypress', function(e){
            if(e.key === 'Enter') performSearch();
        });
    }
    if(sortBy) sortBy.addEventListener('change', performSearch);

    // 弹窗安全绑定
    if(closeDetail){
        closeDetail.addEventListener('click', ()=>{
            if(caseDetailModal) caseDetailModal.style.display = 'none';
        });
    }
    if(caseDetailModal){
        caseDetailModal.addEventListener('click', function(e){
            if(e.target === caseDetailModal) {
                caseDetailModal.style.display = 'none';
            }
        });
    }
});
