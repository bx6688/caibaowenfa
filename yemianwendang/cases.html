<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例检索 - AI法律助手</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* 案例检索页面特定样式 */
        .cases-container {
            padding: 20px;
            height: calc(100vh - 60px);
            overflow-y: auto;
        }

        /* 搜索区域样式 */
        .search-section {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
<!-- 这里保留你原来页面所有DOM（搜索框、快捷卡片、结果区域、弹窗等，我只替换script逻辑） -->

<script>
document.addEventListener('DOMContentLoaded', function(){
    const searchBtn = document.getElementById('searchBtn');
    const caseSearchInput = document.getElementById('caseSearchInput');
    const sortBy = document.getElementById('sortBy');
    const caseResults = document.getElementById('caseResults');
    const resultsNumber = document.getElementById('resultsNumber');
    const loadMoreWrap = document.getElementById('loadMoreWrap');
    const caseDetailModal = document.getElementById('caseDetailModal');
    const closeDetail = document.getElementById('closeDetail');

    let evtSource = null;
    let allLoadedList = [];
    let searchParamsCache = null;

    function fetchPageData(){
        if(evtSource){
            evtSource.close();
        }
        allLoadedList = [];
        caseResults.innerHTML = "";

        evtSource = new EventSource(`/api/stream?${searchParamsCache.toString()}`);

        evtSource.onmessage = function(e){
            try {
                const resObj = JSON.parse(e.data);
                if(resObj.type === "case"){
                    if(!resObj.data){
                        caseResults.innerHTML = `<div class="no-results">未找到匹配案例</div>`;
                        resultsNumber.textContent = 0;
                        loadMoreWrap.style.display = "none";
                        return;
                    }
                    const {final_list, total, tip_msg} = resObj.data;
                    resultsNumber.textContent = total||0;
                    if(!final_list || final_list.length===0){
                        if(allLoadedList.length === 0){
                            caseResults.innerHTML = `<div class="no-results">${tip_msg||"未找到匹配案例"}</div>`;
                        }
                        loadMoreWrap.style.display = "none";
                        return;
                    }
                    // ========== 你原来的案例渲染代码放在这里 ==========
                    // 后续追加列表、渲染卡片逻辑
                }
            } catch (err) {
                console.error("案例数据解析异常", err);
                caseResults.innerHTML = `<div class="no-results">案例数据解析失败</div>`;
                loadMoreWrap.style.display = "none";
            }
        }

        evtSource.onerror = function(){
            evtSource.close();
        }
    }

    function performSearch(){
        const raw_case_type = document.querySelector('[name="case_type"]').value;
        const raw_year = document.querySelector('[name="year"]').value;
        const keyword = document.getElementById('caseSearchInput').value.trim();
        const court = document.getElementById('courtInput').value.trim();
        const sortBy = document.getElementById('sortBy');
        const sort_type = sortBy.value;
        // 映射：前端英文value → Coze脚本白名单中文
        const typeMap = {
            "all": "全部类型",
            "contract": "合同纠纷",
            "labor": "劳动纠纷",
            "property": "物权纠纷",
            "tort": "侵权责任",
            "intellectual": "知识产权",
            "family": "婚姻家庭"
        };
        const case_type = typeMap[raw_case_type];
        // 年份转换：前端all → 0，其他直接传年份字符串
        const year = raw_year === 'all' ? 0 : raw_year;
        // ===== 新版校验规则 =====
        const isAllType = case_type === "全部类型";
        const isAllYear = year === 0;
        // 触发校验：类型是全部 或者 年份是全部
        if (isAllType || isAllYear) {
            // 有效项：关键词不为空 或者 法律援助中心不为空 或者 案件类型不是全部类型
            const valid = keyword || court || (!isAllType);
            if (!valid) {
                alert('【案件类型为全部类型】或【年份范围为全部年份】时，请至少填写：关键词、法律援助中心、选择具体案件类型其中一项！');
                return;
            }
        }
        caseResults.innerHTML = `<div class="no-results">正在AI检索案例...</div>`;
        resultsNumber.textContent = "0";
        loadMoreWrap.style.display = "none";
        // 参数和Coze开始节点输入变量一一对应
        const params = new URLSearchParams();
        params.append("mode","workflow");
        params.append("workflow_id","7702373812499480630");
        params.append("keyword", keyword);
        params.append("case_type", case_type);
        params.append("court", court);
        params.append("year", year);
        params.append("sort_type", sort_type);
        params.append("search_mode","search");
        searchParamsCache = params;
        fetchPageData();
    }

    if(searchBtn) searchBtn.addEventListener('click', performSearch);
    if(caseSearchInput){
        caseSearchInput.addEventListener('keypress', function(e){
            if(e.key === 'Enter') performSearch();
        });
    }
    if(sortBy) sortBy.addEventListener('change', performSearch);

    if(closeDetail){
        closeDetail.addEventListener('click', ()=>{
            caseDetailModal.style.display = 'none';
        });
    }
    caseDetailModal.addEventListener('click', function(e){
        if(e.target === caseDetailModal) caseDetailModal.style.display='none';
    });

    // 快捷类型卡片点击自动搜索（保留你原有卡片逻辑，卡片点击给case_type赋值后调用performSearch）
    const typeCards = document.querySelectorAll('.case-type-card');
    typeCards.forEach(card=>{
        card.addEventListener('click', ()=>{
            const val = card.dataset.value;
            document.querySelector('[name="case_type"]').value = val;
            performSearch();
        })
    })
})
</script>
</body>
</html>
