<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能对话 - AI法律助手</title>
    <link rel="stylesheet" href="styles.css?v=20261109">
</head>
<body>
    <div class="container">
        <!-- 左侧菜单栏 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>AI助手</h3>
                <button class="close-btn" id="close-sidebar">&times;</button>
            </div>
            <div class="sidebar-content">
                <div class="menu-section">
                    <h4 class="section-title">首页</h4>
                    <ul class="menu-list">
                        <li><a href="index.html">返回首页</a></li>
                    </ul>
                </div>
                <div class="menu-section">
                    <h4 class="section-title">对话功能</h4>
                    <ul class="menu-list">
                        <li><a href="dialog.html" class="active">智能对话</a></li>
                    </ul>
                </div>
                <div class="menu-section">
                    <h4 class="section-title">专业服务</h4>
                    <ul class="menu-list">
                        <li><a href="contracts.html">合同审查</a></li>
                        <li><a href="litigation.html">诉状生成</a></li>
                        <li><a href="mock-court/home.html">模拟法庭</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- 主内容区域 -->
        <div class="main-content" id="main-content">
            <div class="header">
                <button class="menu-btn" id="open-sidebar">&#9776;</button>
                <h2>智能对话</h2>
            </div>

            <!-- 对话框区域 -->
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <!-- 消息将通过JavaScript动态添加 -->
                    <div class="message received">
                        <div class="message-content">你好！有什么法律问题可以帮助你解答吗？</div>
                        <div class="message-time">10:00</div>
                    </div>
                </div>
                <div class="chat-input">
                    <button class="attachment-btn" id="attachment-btn" title="上传附件">
                        <i class="paperclip-icon">&#128206;</i>
                    </button>
                    <input type="text" id="message-input" placeholder="输入消息...">
                    <button class="send-btn" id="send-button" title="发送">
                        <i class="paper-plane-icon">&#128233;</i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const baseUrl = "https://caibaowenfa.onrender.com";
            let evtSource = null;
            let selectedAttachmentFile = null;

            const messageInput = document.getElementById('message-input');
            const sendButton = document.getElementById('send-button');
            const chatMessages = document.getElementById('chat-messages');
            const attachmentBtn = document.getElementById('attachment-btn');

            // 隐藏文件选择input
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.style.display = 'none';
            document.body.appendChild(fileInput);

            // 附件按钮点击
            attachmentBtn.addEventListener('click', function () {
                fileInput.click();
            });

            // 文件选中回调
            fileInput.onchange = function (e) {
                const file = e.target.files[0];
                if (!file) return;
                selectedAttachmentFile = file;
                alert(`已选择附件：${file.name}，发送消息时将一并上传`);
            };

            /**
             * 上传文件到后端 /api/upload-coze-file
             * @param {File} fileObj
             * @returns {Promise<Object>}
             */
            async function uploadFile(fileObj) {
                const formData = new FormData();
                formData.append("file", fileObj);
                const resp = await fetch(`${baseUrl}/api/upload-coze-file`, {
                    method: "POST",
                    body: formData
                });
                return await resp.json();
            }

            /**
             * Q版智能体思考动画的 HTML 片段
             */
            function thinkingStageHTML() {
                return `<div class="thinking-stage">
                    <svg class="bot-scene" viewBox="0 0 120 120" role="img" aria-label="智能体正在思考">
                        <defs>
                            <radialGradient id="botGlow" cx="50%" cy="50%" r="50%">
                                <stop offset="0" stop-color="#14C7B0" stop-opacity="0.35"/>
                                <stop offset="1" stop-color="#14C7B0" stop-opacity="0"/>
                            </radialGradient>
                            <linearGradient id="botFaceGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0" stop-color="#1B3550"/>
                                <stop offset="1" stop-color="#0B1B2E"/>
                            </linearGradient>
                        </defs>
                        <circle cx="60" cy="58" r="48" fill="url(#botGlow)" opacity="0.5"/>
                        <g class="bot-orbit">
                            <ellipse cx="60" cy="58" rx="44" ry="20" fill="none" stroke="rgba(198,161,91,0.5)" stroke-width="1.2" stroke-dasharray="4 7"/>
                        </g>
                        <g class="bot-thought">
                            <circle class="s1" cx="95" cy="30" r="2.5" fill="rgba(20,199,176,0.6)"/>
                            <circle class="s2" cx="102" cy="21" r="3.6" fill="rgba(198,161,91,0.6)"/>
                            <circle class="s3" cx="109" cy="10" r="5.5" fill="#FFFDF8" stroke="rgba(198,161,91,0.55)"/>
                        </g>
                        <g class="bot">
                            <rect x="42" y="88" width="36" height="24" rx="10" fill="#12283F"/>
                            <rect x="50" y="94" width="20" height="12" rx="6" fill="rgba(20,199,176,0.16)" stroke="rgba(198,161,91,0.7)" stroke-width="1"/>
                            <line x1="60" y1="30" x2="60" y2="15" stroke="#C6A15B" stroke-width="2.5" stroke-linecap="round"/>
                            <circle class="bot-antenna" cx="60" cy="12" r="3.6" fill="#C6A15B"/>
                            <rect x="24" y="46" width="6" height="20" rx="3" fill="#0B1B2E"/>
                            <rect x="90" y="46" width="6" height="20" rx="3" fill="#0B1B2E"/>
                            <rect x="30" y="30" width="60" height="56" rx="20" fill="#12283F" stroke="rgba(198,161,91,0.45)" stroke-width="1.2"/>
                            <rect x="35" y="35" width="50" height="46" rx="16" fill="url(#botFaceGrad)"/>
                            <g class="bot-eyes">
                                <rect x="43" y="50" width="11" height="9" rx="4.5" fill="#7FE3D6"/>
                                <rect x="66" y="50" width="11" height="9" rx="4.5" fill="#7FE3D6"/>
                            </g>
                            <rect x="52" y="67" width="16" height="3" rx="1.5" fill="rgba(127,227,214,0.75)"/>
                        </g>
                    </svg>
                    <div class="loading-tip">智能体正在思考中</div>
                </div>`;
            }

            /**
             * 发送消息，SSE流式请求
             */
            async function sendMessage() {
                if (evtSource) {
                    evtSource.close();
                }

                const messageText = messageInput.value.trim();
                let sendText = messageText;

                // 只上传附件、无文字时填充默认提示
                if (!sendText && selectedAttachmentFile) {
                    sendText = "请分析这份上传的文件";
                }
                if (!sendText && !selectedAttachmentFile) {
                    return;
                }

                // 获取当前时间
                const now = new Date();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                const timeString = `${hours}:${minutes}`;

                // 渲染用户消息气泡
                const userEl = document.createElement('div');
                userEl.className = "message sent";
                let htmlContent = `<div class="message-content">${messageText || "(上传文件)"}`;
                if (selectedAttachmentFile) {
                    htmlContent += `<br><span style="color:#cce;">📎 ${selectedAttachmentFile.name}</span>`;
                }
                htmlContent += `</div><div class="message-time">${timeString}</div>`;
                userEl.innerHTML = htmlContent;
                chatMessages.appendChild(userEl);
                messageInput.value = '';

                // 渲染AI气泡 + Q版律师思考动画
                const aiEl = document.createElement('div');
                aiEl.className = "message received thinking";
                aiEl.innerHTML = `
                    <div class="message-content">
                        ${thinkingStageHTML()}
                    </div>
                    <div class="message-time">${timeString}</div>
                `;
                chatMessages.appendChild(aiEl);

                const aiContentDom = aiEl.querySelector('.message-content');
                let thinkingDone = false;
                function finishThinking() {
                    if (thinkingDone) return;
                    thinkingDone = true;
                    aiEl.classList.remove('thinking');
                    const stage = aiEl.querySelector('.thinking-stage');
                    if (stage) stage.remove();
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;

                let fileId = "";
                // 先上传附件
                if (selectedAttachmentFile) {
                    try {
                        const uploadRes = await uploadFile(selectedAttachmentFile);
                        if (!uploadRes.ok) {
                            finishThinking();
                            aiContentDom.innerText = `附件上传失败：${uploadRes.msg}`;
                            selectedAttachmentFile = null;
                            fileInput.value = '';
                            return;
                        }
                        fileId = uploadRes.file_id;
                    } catch (err) {
                        finishThinking();
                        aiContentDom.innerText = "附件上传网络异常";
                        selectedAttachmentFile = null;
                        fileInput.value = '';
                        return;
                    }
                }

                // 拼接SSE请求参数
                const params = new URLSearchParams();
                params.append("mode", "bot");
                params.append("user_id", "123456");
                params.append("msg", sendText);
                if (fileId) {
                    params.append("file_id", fileId);
                }

                const url = `${baseUrl}/api/stream?${params.toString()}`;
                evtSource = new EventSource(url);
                let renderedText = "";


evtSource.onmessage = (e) => {
    if (e.data === "PING") return;
    if (e.data === "[DONE]") {
        evtSource.close();
        selectedAttachmentFile = null;
        fileInput.value = '';
        finishThinking();
        return;
    }
    try {
        const obj = JSON.parse(e.data);
        if (obj.content) {
            // 过滤finish字符串
            if (obj.content.startsWith('{"msg_type":"generate_answer_finish"')) {
                return;
            }
            finishThinking();
            // 去重逻辑
            if (obj.content.startsWith(renderedText)) {
                const newChunk = obj.content.slice(renderedText.length);
                aiContentDom.innerText += newChunk;
                renderedText = obj.content;
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    } catch (err) {
        console.log('解析失败', e.data);
    }
};

                evtSource.onerror = () => {
                    evtSource.close();
                    selectedAttachmentFile = null;
                    fileInput.value = '';
                    finishThinking();
                    aiContentDom.innerText += "请求出错";
                };
            }

            // 绑定事件
            if (sendButton) {
                sendButton.addEventListener('click', sendMessage);
            }
            if (messageInput) {
                messageInput.addEventListener('keypress', function(event) {
                    if (event.key === 'Enter') {
                        sendMessage();
                    }
                });
            }

            // 本地预览：?thinking-demo=1 时直接展示思考动画，不请求后端
            if (chatMessages && new URLSearchParams(location.search).get('thinking-demo') === '1') {
                const demoEl = document.createElement('div');
                demoEl.className = 'message received thinking';
                demoEl.innerHTML = '<div class="message-content">' + thinkingStageHTML() + '</div><div class="message-time">—</div>';
                chatMessages.appendChild(demoEl);
            }

            if (chatMessages) {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        });
    </script>
</body>
</html>
