<style>
:root{
  --bg:#f7f0e4;
  --ink:#2a2118;
  --muted:#7b6a55;
  --accent:#9d2c24;
  --wood-dark:#332415;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--wood-dark);color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased;overflow:hidden;}
::selection{background:var(--accent);color:#fff;}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}

.cover{
  position:relative;min-height:100vh;min-height:100svh;
  display:flex;align-items:flex-end;background:var(--wood-dark);overflow:hidden;
}
.cover-img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 32%;
  animation:coverZoom 24s ease-out forwards;
}
@keyframes coverZoom{from{transform:scale(1.06);}to{transform:scale(1);}}
.cover-overlay{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(20,12,7,0.30) 0%,rgba(20,12,7,0.04) 30%,rgba(20,12,7,0.10) 55%,rgba(20,12,7,0.72) 82%,rgba(20,12,7,0.92) 100%),
    linear-gradient(90deg,rgba(20,12,7,0.55) 0%,rgba(20,12,7,0.14) 52%,rgba(20,12,7,0) 78%);
}
.cover-inner{
  position:relative;z-index:3;width:100%;max-width:1140px;margin:0 auto;
  padding:0 40px 8vh;color:#f6ead6;
}
.eyebrow{
  display:flex;align-items:center;gap:14px;
  font-family:var(--sans);font-size:11px;letter-spacing:.3em;color:#e4c79b;
  margin-bottom:20px;
}
.eyebrow::before{content:"";width:40px;height:2px;background:#b08a4f;}
h1{
  font-size:clamp(56px,8vw,104px);font-weight:700;line-height:1.08;
  letter-spacing:.2em;text-indent:.2em;color:#fbf3e4;
  text-shadow:0 4px 30px rgba(0,0,0,0.35);
}
.sub{
  margin-top:16px;font-size:15px;letter-spacing:.42em;text-indent:.42em;
  color:#e9c98f;
}
.desc{
  margin-top:20px;max-width:520px;font-size:14.5px;line-height:1.9;
  color:rgba(246,234,214,0.82);
}
.actions{margin-top:34px;}
.enter{
  display:inline-flex;align-items:center;gap:12px;
  font-family:var(--sans);font-size:13px;letter-spacing:.18em;
  background:var(--accent);color:#fff;padding:15px 34px;
  border:1px solid rgba(255,255,255,0.14);
  box-shadow:0 14px 34px rgba(0,0,0,0.32);
  transition:all .25s ease;
}
.enter:hover{background:#8a251e;transform:translateY(-2px);box-shadow:0 20px 40px rgba(0,0,0,0.4);}
.enter .arrow{transition:transform .25s ease;}
.enter:hover .arrow{transform:translateX(4px);}

.back{
  position:fixed;top:22px;left:24px;z-index:20;
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--sans);font-size:11px;letter-spacing:.16em;
  color:rgba(246,234,214,.78);
  padding:9px 16px;border:1px solid rgba(246,234,214,.26);border-radius:999px;
  background:rgba(20,12,7,.42);backdrop-filter:blur(10px);
  transition:all .25s ease;
}
.back:hover{color:#fbf3e4;border-color:rgba(228,199,155,.6);background:rgba(20,12,7,.64);}

.cover-foot{
  position:absolute;left:0;right:0;bottom:18px;z-index:3;
  max-width:1140px;margin:0 auto;padding:0 40px;
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-family:var(--sans);font-size:9.5px;letter-spacing:.2em;
  color:rgba(246,234,214,0.42);
}

/* ---------- 小工具菜单 ---------- */
.tools{position:fixed;top:22px;right:24px;z-index:20;}
.tools-btn{
  width:40px;height:40px;border-radius:12px;
  border:1px solid rgba(246,234,214,.26);
  background:rgba(20,12,7,.42);
  backdrop-filter:blur(10px);
  display:grid;place-content:center;gap:4px;
  cursor:pointer;transition:all .25s ease;
}
.tools-btn span{display:block;width:4px;height:4px;border-radius:50%;background:#f3e6cf;transition:background .25s ease;}
.tools-btn:hover, .tools-btn[aria-expanded="true"]{
  border-color:rgba(228,199,155,.6);background:rgba(20,12,7,.64);
}
.tools-panel{
  position:absolute;right:0;top:calc(100% + 12px);width:262px;padding:8px;
  background:rgba(20,12,7,.94);backdrop-filter:blur(14px);
  border:1px solid rgba(228,199,155,.24);border-radius:14px;
  box-shadow:0 24px 48px rgba(0,0,0,.45);
  opacity:0;visibility:hidden;transform:translateY(-8px);
  transition:opacity .2s ease,transform .2s ease,visibility .2s;
}
.tools-panel.open{opacity:1;visibility:visible;transform:translateY(0);}
.tools-head{
  font-family:var(--sans);font-size:10px;letter-spacing:.2em;
  color:rgba(246,234,214,.55);padding:7px 10px 8px;
}
.tool-item{
  display:flex;align-items:center;gap:11px;
  padding:10px;border-radius:10px;
  transition:background .2s ease;
}
.tool-item:hover{background:rgba(228,199,155,.10);}
.tool-ic{
  flex:none;width:34px;height:34px;border-radius:9px;
  background:rgba(228,199,155,.12);
  display:grid;place-items:center;font-size:16px;
}
.tool-txt{flex:1;min-width:0;font-family:var(--sans);}
.tool-txt b{display:block;font-size:13px;font-weight:600;color:#f6ead6;}
.tool-txt small{display:block;font-size:11px;color:rgba(246,234,214,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tool-arrow{flex:none;font-size:12px;color:#e4c79b;}

@media (max-width:680px){
  .cover-inner{padding:0 22px 9vh;}
  .cover-foot{padding:0 22px;}
  .tools{top:16px;right:16px;}
  .tools-panel{width:min(262px,calc(100vw - 32px));}
  h1{letter-spacing:.14em;text-indent:.14em;}
  .sub{letter-spacing:.28em;text-indent:.28em;font-size:13px;}
  .desc{font-size:13.5px;}
  .enter{padding:13px 26px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;}
}
</style>
